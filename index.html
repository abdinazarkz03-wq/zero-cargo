<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZERO CARGO | Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ======== Стили (оставлены ваши) ======== */
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{background:#f5f5f5;color:#333}
.app{max-width:480px;margin:0 auto;background:white;min-height:100vh;position:relative;padding-bottom:70px}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:20px;position:sticky;top:0;z-index:10}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.header h1{font-size:24px;font-weight:600}
.menu-btn,.back-btn,.add-btn{font-size:24px;cursor:pointer;background:none;border:none;color:white;padding:5px 10px}
.user-info{background:rgba(255,255,255,.2);padding:10px 15px;border-radius:12px;font-size:14px}
.user-code{font-weight:600;font-size:16px}
/* ===== Остальные стили оставлены как есть ===== */
</style>
</head>
<body>
<div class="app">
    <!-- Шапка -->
    <div class="header">
        <div class="header-top">
            <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none">←</button>
            <h1 id="pageTitle">ZERO CARGO</h1>
            <div class="menu-btn" onclick="toggleMenu()">☰</div>
        </div>
        <div class="user-info">
            <span class="user-code" data-user="personal_code">Загрузка...</span>
        </div>
    </div>

    <!-- Страницы -->
    <div id="pageMain" class="page active">
        <div class="dashboard">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="waitingCount">0</div><div class="stat-label">В ожидании</div></div>
                <div class="stat-card"><div class="stat-value" id="chinaCount">0</div><div class="stat-label">В Китае</div></div>
                <div class="stat-card"><div class="stat-value" id="transitCount">0</div><div class="stat-label">В пути</div></div>
                <div class="stat-card"><div class="stat-value" id="readyCount">0</div><div class="stat-label">Готовы</div></div>
            </div>

            <div class="china-address-card">
                <h3>🇨🇳 Адрес склада в Китае</h3>
                <div class="address-content">
                    <p>收件人：<span data-user="china_code">---</span></p>
                    <p>电话 ：13545100875</p>
                    <p>广东省佛山市南海区里广路洲村工业区飞机场13-2号</p>
                    <p>（TSL КАРГО）<span data-user="china_code">---</span>(Ваш код клиента)</p>
                </div>
                <button class="copy-btn" onclick="copyChinaAddress()">📋 Скопировать весь адрес</button>
            </div>

            <div class="quick-links">
                <a href="https://wa.me/996505600542" target="_blank" class="quick-link"><span class="icon">📱</span><span>WhatsApp</span></a>
                <a href="https://instagram.com/zero_cargo.312" target="_blank" class="quick-link"><span class="icon">📷</span><span>Instagram</span></a>
                <a href="#" onclick="showPage('parcels')" class="quick-link"><span class="icon">📦</span><span>Посылки</span></a>
            </div>
        </div>
    </div>

    <div id="pageProfile" class="page">
        <div class="profile-container">
            <!-- ваш профиль остался без изменений -->
        </div>
    </div>

    <div id="pageParcels" class="page">
        <div class="parcels-tabs">
            <button class="tab active" onclick="filterParcels('all', event)">Все</button>
            <button class="tab" onclick="filterParcels('transit', event)">В пути</button>
            <button class="tab" onclick="filterParcels('ready', event)">Готовы</button>
        </div>
        <div class="parcels-list" id="parcelsList"></div>
        <div class="add-track-section">
            <h3>Добавить трек-код</h3>
            <p class="hint">Можно разделить через запятую</p>
            <div class="add-track-input">
                <input type="text" id="trackInput" placeholder="YT1111, 67899876 куртка">
                <button onclick="submitTracks()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Боковое меню и нижнее меню оставлены без изменений -->
</div>

<script>
// Telegram WebApp и данные пользователя
let tg = window.Telegram.WebApp;
tg.expand(); tg.ready();

let userData = {id:null,full_name:'',phone:'',address:'',personal_code:'',china_code:'',parcels:[]};

// Загрузка данных
document.addEventListener('DOMContentLoaded',function(){
    tg.sendData(JSON.stringify({action:'getUserData',initData:tg.initData||''}));
    showLoading();
    setTimeout(()=>{hideLoading();},10000);
});

// Получение сообщений
Telegram.WebApp.onEvent('message', function(event){
    try {
        let data = (typeof event==='string') ? JSON.parse(event) : event.data ? JSON.parse(event.data) : event;
        if(data.type==='userData'){userData=data.data;updateUI();hideLoading();}
        else if(data.type==='error'){hideLoading(); tg.showPopup({title:'❌ Ошибка',message:data.message||'Не удалось загрузить данные',buttons:[{type:'ok'}]});}
    } catch(e){console.error(e);}
});

// Обновление UI
function updateUI(){
    document.querySelectorAll('[data-user="full_name"]').forEach(el=>el.textContent=userData.full_name||'Не указано');
    document.querySelectorAll('[data-user="personal_code"]').forEach(el=>el.textContent=userData.personal_code||'---');
    document.querySelectorAll('[data-user="china_code"]').forEach(el=>el.textContent=userData.china_code||'---');
    document.querySelectorAll('[data-user="phone"]').forEach(el=>el.textContent=userData.phone||'---');
    document.querySelectorAll('[data-user="address"]').forEach(el=>el.textContent=userData.address||'Не указан');
    updateParcelsStats(); displayParcels(userData.parcels||[]);
}

function updateParcelsStats(){
    const parcels=userData.parcels||[];
    const stats={waiting:parcels.filter(p=>p.status==='В ожидании'||p.status==='pending').length,
                 china:parcels.filter(p=>p.status==='На складе в Китае'||p.status==='in_china').length,
                 transit:parcels.filter(p=>p.status==='В пути'||p.status==='transit').length,
                 ready:parcels.filter(p=>p.status==='Готов к выдаче'||p.status==='ready').length};
    ['waitingCount','chinaCount','transitCount','readyCount'].forEach((id,i)=>document.getElementById(id).textContent=Object.values(stats)[i]);
}

// Копирование
function copyChinaAddress(){navigator.clipboard.writeText(`收件人：${userData.china_code}\n电话 ：13545100875\n广东省佛山市南海区里广路洲村工业区飞机场13-2号\n（TSL КАРГО）${userData.china_code}(Ваш код клиента)`).then(()=>tg.showPopup({title:'✅ Скопировано',message:'Адрес склада в Китае скопирован',buttons:[{type:'ok'}]}));}
function copyField(field){let text='';switch(field){case'personal_code':text=userData.personal_code||'';break;case'china_code':text=userData.china_code||'';break;case'phone':text=userData.phone||'';break;case'pvz_phone':text='0505600542';break;}navigator.clipboard.writeText(text).then(()=>tg.showPopup({title:'✅ Скопировано',message:'Текст скопирован в буфер обмена',buttons:[{type:'ok'}]}));}

// Навигация
function showPage(pageName){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    const title=document.getElementById('pageTitle');
    const backBtn=document.getElementById('backBtn');
    switch(pageName){
        case'main':document.getElementById('pageMain').classList.add('active'); title.textContent='ZERO CARGO'; backBtn.style.display='none';break;
        case'profile':document.getElementById('pageProfile').classList.add('active'); title.textContent='Профиль'; backBtn.style.display='block';break;
        case'parcels':document.getElementById('pageParcels').classList.add('active'); title.textContent='Посылки'; backBtn.style.display='block';break;
        case'addresses':title.textContent='Адреса'; backBtn.style.display='block';break;
        case'instructions':title.textContent='Инструкция'; backBtn.style.display='block';break;
        case'prohibited':title.textContent='Запрещенные товары'; backBtn.style.display='block';break;
        case'support':title.textContent='Поддержка'; backBtn.style.display='block';break;
        case'addTrack':title.textContent='Добавить трек'; backBtn.style.display='block';break;
        default:document.getElementById('pageMain').classList.add('active'); title.textContent='ZERO CARGO'; backBtn.style.display='none';
    }
}

function goBack(){showPage('main');}

// Фильтрация посылок
function filterParcels(filter,event){
    const parcels=userData.parcels||[];
    let filtered=[];
    switch(filter){case'all':filtered=parcels;break;case'transit':filtered=parcels.filter(p=>p.status==='В пути'||p.status==='transit');break;case'ready':filtered=parcels.filter(p=>p.status==='Готов к выдаче'||p.status==='ready');break;default:filtered=parcels;}
    displayParcels(filtered);
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    if(event && event.target) event.target.classList.add('active');
}

// Отображение посылок
function displayParcels(parcels){
    const list=document.getElementById('parcelsList');
    if(!list) return;
    if(!parcels||parcels.length===0){list.innerHTML=`<div class="empty-state"><span class="empty-icon">📭</span><p>У вас пока нет посылок</p><button class="add-track-btn" onclick="showPage('addTrack')">➕ Добавить трек</button></div>`;return;}
    list.innerHTML=parcels.map(p=>{let statusClass='',statusText=p.status||'В ожидании';switch(p.status){case'В пути':case'transit':statusClass='status-transit';statusText='В пути';break;case'Готов к выдаче':case'ready':statusClass='status-ready';statusText='Готов к выдаче';break;case'Получено':case'received':statusClass='status-received';statusText='Получено';break;default:statusClass='status-waiting';statusText='В ожидании';}return`<div class="parcel-item"><div class="parcel-header"><span class="parcel-track">${p.track_code||p.track}</span><span class="parcel-status ${statusClass}">${statusText}</span></div>${p.description?`<div class="parcel-desc">📝 ${p.description}</div>`:''}<div class="parcel-date">📅 ${p.created_at?new Date(p.created_at).toLocaleDateString('ru-RU'):''}</div></div>`;}).join('');
}

// Отправка трек-кодов
function submitTracks(){
    const input=document.getElementById('trackInput');
    if(!input||!input.value.trim()){tg.showPopup({title:'⚠️ Внимание',message:'Введите трек-код',buttons:[{type:'ok'}]});return;}
    const tracks=input.value.split(',').map(t=>t.trim());
    tg.sendData(JSON.stringify({action:'addTracks',tracks:tracks}));
    tg.showPopup({title:'✅ Отправлено',message:`Трек-коды отправлены на обработку`,buttons:[{type:'ok'}]});
    input.value='';
}

// Боковое меню
function toggleMenu(){document.getElementById('sideMenu').classList.toggle('active');}

// Загрузка / лоадер
function showLoading(){
    if(!document.getElementById('loader')){
        const loader=document.createElement('div'); loader.id='loader'; loader.className='loader';
        loader.innerHTML='<div class="spinner"></div><div>Загрузка...</div>'; document.body.appendChild(loader);
    }
}
function hideLoading(){const loader=document.getElementById('loader'); if(loader) loader.remove();}
</script>
</body>
</html>
