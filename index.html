<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO CARGO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:sans-serif;padding:20px;background:#f5f5f5}
button{padding:10px 20px;margin:10px;border:none;border-radius:8px;background:#667eea;color:white;cursor:pointer}
</style>
</head>
<body>
<h1>ZERO CARGO</h1>
<p>Личный кабинет</p>
<button id="getUser">Получить мои данные</button>
<div id="info"></div>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

document.getElementById("getUser").addEventListener("click", ()=>{
    tg.sendData(JSON.stringify({action:"getUserData"}));
});

window.Telegram.WebApp.onEvent("data",(event)=>{
    const info = document.getElementById("info");
    try{
        const data = typeof event==="string"?JSON.parse(event):event;
        if(data.type==="userData"){
            info.innerHTML = `<pre>${JSON.stringify(data.data,null,2)}</pre>`;
        }else if(data.type==="error"){
            info.textContent = data.message;
        }
    }catch(e){console.error(e);}
});
</script>
</body>
</html>
