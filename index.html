<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZERO CARGO | Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Poppins', sans-serif;}
body{background:#111;color:#fff;}
.app{max-width:480px;margin:0 auto;background:#111;min-height:100vh;padding-bottom:80px;}
.header{background:linear-gradient(135deg,#ff1a1a 0%,#000 100%);padding:20px;position:sticky;top:0;z-index:10;}
.header h1{font-size:24px;font-weight:700;color:#fff;}
.user-info{background:rgba(255,0,0,0.2);padding:10px 15px;border-radius:12px;margin-top:10px;text-align:center;font-size:14px;}
.user-code{font-weight:700;font-size:16px;color:#fff;}
.page{display:none;padding:15px;}
.page.active{display:block;}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:15px;}
.stat-card{background:#1a1a1a;padding:20px;border-radius:12px;text-align:center;box-shadow:0 4px 12px rgba(255,0,0,0.3);transition:0.3s;}
.stat-card:hover{transform:translateY(-5px);box-shadow:0 6px 18px rgba(255,0,0,0.5);}
.stat-value{font-weight:700;font-size:26px;color:#ff1a1a;}
.stat-label{font-size:14px;color:#ccc;margin-top:5px;}
.china-address-card{background:#1a1a1a;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 4px 12px rgba(255,0,0,0.3);}
.china-address-card h3{color:#ff1a1a;margin-bottom:10px;}
.address-content p{margin-bottom:5px;font-size:14px;color:#fff;}
.copy-btn{background:#ff1a1a;color:white;border:none;padding:10px 15px;border-radius:12px;cursor:pointer;transition:0.3s;}
.copy-btn:hover{background:#e60000;transform:scale(1.05);}
.quick-links{display:flex;justify-content:space-between;margin-bottom:15px;}
.quick-link{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;font-size:14px;padding:12px;background:#1a1a1a;border-radius:12px;width:30%;text-align:center;box-shadow:0 4px 12px rgba(255,0,0,0.3);transition:0.3s;}
.quick-link:hover{background:#000;transform:translateY(-3px);}
.quick-link span:first-child{font-size:22px;margin-bottom:5px;}
.side-menu{position:fixed;top:0;left:-260px;width:260px;height:100%;background:#000;color:#fff;transition:0.3s;z-index:20;padding-top:60px;box-shadow:2px 0 12px rgba(255,0,0,0.5);}
.side-menu.active{left:0;}
.side-menu .menu-header{position:absolute;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#ff1a1a;}
.side-menu .menu-header h3{margin:0;font-size:18px;color:#fff;}
.side-menu .menu-header button{background:none;border:none;font-size:20px;color:#fff;cursor:pointer;}
.side-menu .menu-list{list-style:none;padding:0;margin-top:20px;}
.side-menu .menu-list li a{display:block;padding:12px 20px;color:#fff;text-decoration:none;font-size:16px;}
.side-menu .menu-list li a:hover{background: rgba(255,0,0,0.3);}
.bottom-menu{position: fixed;bottom:0;left:0;width:100%;height:60px;background:#111;border-top:1px solid #ff1a1a;display:flex;justify-content: space-around;align-items: center;z-index:10;}
.bottom-menu button{background:none;border:none;font-size:24px;cursor:pointer;color:#ff1a1a;}
</style>
</head>
<body>
<div class="app">

<!-- Header -->
<div class="header">
    <div style="display:flex;justify-content:space-between;align-items:center;">
        <h1>ZERO CARGO</h1>
        <div onclick="toggleMenu()" style="font-size:24px;cursor:pointer;">☰</div>
    </div>
    <div class="user-info">
        <span class="user-code" data-user="personal_code">Загрузка...</span>
    </div>
</div>

<!-- Main Page -->
<div id="pageMain" class="page active">
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="waitingCount">0</div><div class="stat-label">В ожидании</div></div>
        <div class="stat-card"><div class="stat-value" id="chinaCount">0</div><div class="stat-label">В Китае</div></div>
        <div class="stat-card"><div class="stat-value" id="transitCount">0</div><div class="stat-label">В пути</div></div>
        <div class="stat-card"><div class="stat-value" id="readyCount">0</div><div class="stat-label">Готовы</div></div>
    </div>

    <div class="china-address-card">
        <h3>🇨🇳 Адрес склада в Китае</h3>
        <div class="address-content">
            <p>收件人：VXMMM</p>
            <p>电话 ：13545100875</p>
            <p>广东省佛山市南海区里广路洲村工业区飞机场13-2号</p>
            <p>（TSL КАРГО）VXMMM(Ваш код клиента)</p>
        </div>
        <button class="copy-btn" onclick="copyChinaAddress()">📋 Скопировать адрес</button>
    </div>

    <div class="quick-links">
        <a href="https://wa.me/996505600542" target="_blank" class="quick-link"><span>📱</span><span>WhatsApp</span></a>
        <a href="https://instagram.com/zero_cargo.312" target="_blank" class="quick-link"><span>📷</span><span>Instagram</span></a>
        <a href="https://instagram.com/your_shop_account" target="_blank" class="quick-link"><span>🛒</span><span>Магазин</span></a>
    </div>
</div>

<!-- Side Menu -->
<div id="sideMenu" class="side-menu">
    <div class="menu-header">
        <h3>Меню</h3>
        <button onclick="toggleMenu()">✖</button>
    </div>
    <ul class="menu-list">
        <li><a href="#" onclick="goBack(); toggleMenu()">🏠 Главная</a></li>
    </ul>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
function copyChinaAddress(){
    const text = `收件人：VXMMM\n电话 ：13545100875\n广东省佛山市南海区里广路洲村工业区飞机场13-2号\n（TSL КАРГО）VXMMM(Ваш код клиента)`;
    navigator.clipboard.writeText(text).then(()=>tg.showPopup({title:'✅ Скопировано', message:'Адрес скопирован', buttons:[{type:'ok'}]}));
}
function toggleMenu(){
    document.getElementById('sideMenu').classList.toggle('active');
}
function goBack(){
    document.getElementById('pageMain').classList.add('active');
}
</script>
</body>
</html>
