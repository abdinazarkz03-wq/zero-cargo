<script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let userData = {
            id: null,
            full_name: '',
            phone: '',
            address: '',
            personal_code: '',
            china_code: '',
            parcels: []
        };

        // Загрузка данных - ИСПРАВЛЕНО
        document.addEventListener('DOMContentLoaded', function() {
            console.log('WebApp загружен, отправляем запрос данных...');
            
            // Получаем данные инициализации от Telegram
            const initData = tg.initData || '';
            console.log('InitData длина:', initData.length);
            
            // Отправляем запрос с initData
            tg.sendData(JSON.stringify({ 
                action: 'getUserData',
                initData: initData
            }));
            
            showLoading();
            
            // Таймаут на случай если бот не отвечает
            setTimeout(function() {
                if (document.getElementById('loader')) {
                    hideLoading();
                    tg.showPopup({
                        title: '⚠️ Таймаут',
                        message: 'Бот не отвечает. Проверьте подключение.',
                        buttons: [{type: 'ok'}]
                    });
                }
            }, 10000);
        });

        // Получение данных от бота
        Telegram.WebApp.onEvent('message', function(event) {
            console.log('Получено сообщение от бота:', event);
            try {
                let data;
                if (typeof event === 'string') {
                    data = JSON.parse(event);
                } else if (event.data) {
                    data = JSON.parse(event.data);
                } else {
                    data = event;
                }
                
                console.log('Распарсенные данные:', data);
                
                if (data.type === 'userData') {
                    userData = data.data;
                    console.log('Данные пользователя загружены:', userData);
                    updateUI();
                    hideLoading();
                } else if (data.type === 'error') {
                    console.error('Ошибка от бота:', data.message);
                    hideLoading();
                    tg.showPopup({
                        title: '❌ Ошибка',
                        message: data.message || 'Не удалось загрузить данные',
                        buttons: [{type: 'ok'}]
                    });
                }
            } catch (e) {
                console.error('Ошибка парсинга данных:', e, event);
                hideLoading();
            }
        });

        // Обновление интерфейса
        function updateUI() {
            console.log('Обновление UI с данными:', userData);
            
            document.querySelectorAll('[data-user="full_name"]').forEach(el => {
                el.textContent = userData.full_name || 'Не указано';
            });
            
            document.querySelectorAll('[data-user="personal_code"]').forEach(el => {
                el.textContent = userData.personal_code || '---';
            });
            
            document.querySelectorAll('[data-user="china_code"]').forEach(el => {
                el.textContent = userData.china_code || '---';
            });
            
            document.querySelectorAll('[data-user="phone"]').forEach(el => {
                el.textContent = userData.phone || '---';
            });
            
            document.querySelectorAll('[data-user="address"]').forEach(el => {
                el.textContent = userData.address || 'Не указан';
            });
            
            document.querySelectorAll('.profile-title h2').forEach(el => {
                el.textContent = userData.full_name || 'Клиент';
            });
            
            document.querySelectorAll('.profile-title p').forEach(el => {
                el.textContent = userData.personal_code || '---';
            });
            
            updateParcelsStats();
            displayParcels(userData.parcels || []);
        }

        // Обновление статистики посылок
        function updateParcelsStats() {
            const parcels = userData.parcels || [];
            
            const stats = {
                waiting: parcels.filter(p => p.status === 'В ожидании' || p.status === 'pending').length,
                china: parcels.filter(p => p.status === 'На складе в Китае' || p.status === 'in_china').length,
                transit: parcels.filter(p => p.status === 'В пути' || p.status === 'transit').length,
                ready: parcels.filter(p => p.status === 'Готов к выдаче' || p.status === 'ready').length
            };
            
            console.log('Статистика посылок:', stats);
            
            const waitingEl = document.getElementById('waitingCount');
            const chinaEl = document.getElementById('chinaCount');
            const transitEl = document.getElementById('transitCount');
            const readyEl = document.getElementById('readyCount');
            
            if (waitingEl) waitingEl.textContent = stats.waiting;
            if (chinaEl) chinaEl.textContent = stats.china;
            if (transitEl) transitEl.textContent = stats.transit;
            if (readyEl) readyEl.textContent = stats.ready;
        }

        // Копирование адреса Китая
        function copyChinaAddress() {
            const chinaCode = userData.china_code || 'XXX';
            
            const address = `收件人：${chinaCode}
电话 ：13545100875
广东省佛山市南海区里广路洲村工业区飞机场13-2号
（TSL КАРГО）${chinaCode}(Ваш код клиента)`;
            
            navigator.clipboard.writeText(address).then(() => {
                tg.showPopup({
                    title: '✅ Скопировано',
                    message: 'Адрес склада в Китае скопирован',
                    buttons: [{type: 'ok'}]
                });
            }).catch(() => {
                tg.showPopup({
                    title: '❌ Ошибка',
                    message: 'Не удалось скопировать адрес',
                    buttons: [{type: 'ok'}]
                });
            });
        }

        // Копирование поля
        function copyField(fieldName) {
            let text = '';
            
            switch(fieldName) {
                case 'personal_code':
                    text = userData.personal_code || '';
                    break;
                case 'china_code':
                    text = userData.china_code || '';
                    break;
                case 'phone':
                    text = userData.phone || '';
                    break;
                case 'pvz_phone':
                    text = '0505600542';
                    break;
                default:
                    text = '';
            }
            
            navigator.clipboard.writeText(text).then(() => {
                tg.showPopup({
                    title: '✅ Скопировано',
                    message: 'Текст скопирован в буфер обмена',
                    buttons: [{type: 'ok'}]
                });
            });
        }

        // Фильтрация посылок
        function filterParcels(filter) {
            const parcels = userData.parcels || [];
            let filtered = [];
            
            switch(filter) {
                case 'all':
                    filtered = parcels;
                    break;
                case 'transit':
                    filtered = parcels.filter(p => p.status === 'В пути' || p.status === 'transit');
                    break;
                case 'ready':
                    filtered = parcels.filter(p => p.status === 'Готов к выдаче' || p.status === 'ready');
                    break;
                default:
                    filtered = parcels;
            }
            
            displayParcels(filtered);
            
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Отображение посылок
        function displayParcels(parcels) {
            const list = document.getElementById('parcelsList');
            if (!list) return;
            
            if (!parcels || parcels.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-icon">📭</span>
                        <p>У вас пока нет посылок</p>
                        <button class="add-track-btn" onclick="showPage('addTrack')">➕ Добавить трек</button>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = parcels.map(p => {
                let statusClass = '';
                let statusText = p.status || 'В ожидании';
                
                switch(p.status) {
                    case 'В пути':
                    case 'transit':
                        statusClass = 'status-transit';
                        statusText = 'В пути';
                        break;
                    case 'Готов к выдаче':
                    case 'ready':
                        statusClass = 'status-ready';
                        statusText = 'Готов к выдаче';
                        break;
                    case 'Получено':
                    case 'received':
                        statusClass = 'status-received';
                        statusText = 'Получено';
                        break;
                    default:
                        statusClass = 'status-waiting';
                        statusText = 'В ожидании';
                }
                
                return `
                    <div class="parcel-item">
                        <div class="parcel-header">
                            <span class="parcel-track">${p.track_code || p.track}</span>
                            <span class="parcel-status ${statusClass}">${statusText}</span>
                        </div>
                        ${p.description ? `<div class="parcel-desc">📝 ${p.description}</div>` : ''}
                        <div class="parcel-date">📅 ${p.created_at ? new Date(p.created_at).toLocaleDateString('ru-RU') : ''}</div>
                    </div>
                `;
            }).join('');
        }

        // Отправка трек-кодов
        function submitTracks() {
            const input = document.getElementById('trackInput');
            if (!input || !input.value.trim()) {
                tg.showPopup({
                    title: '⚠️ Внимание',
                    message: 'Введите трек-код',
                    buttons: [{type: 'ok'}]
                });
                return;
            }
            
            const tracks = input.value.split(',').map(t => t.trim());
            
            tg.sendData(JSON.stringify({
                action: 'addTracks',
                tracks: tracks
            }));
            
            tg.showPopup({
                title: '✅ Отправлено',
                message: `Трек-коды отправлены на обработку`,
                buttons: [{type: 'ok'}]
            });
            
            input.value = '';
        }

        // Навигация по страницам
        function showPage(pageName) {
            console.log('Переход на страницу:', pageName);
            
            // Скрываем все страницы
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            
            // Показываем выбранную страницу
            if (pageName === 'main') {
                document.getElementById('pageMain').classList.add('active');
                document.getElementById('pageTitle').textContent = 'ZERO CARGO';
                document.getElementById('backBtn').style.display = 'none';
            } else if (pageName === 'profile') {
                document.getElementById('pageProfile').classList.add('active');
                document.getElementById('pageTitle').textContent = 'Профиль';
                document.getElementById('backBtn').style.display = 'block';
            } else if (pageName === 'parcels') {
                document.getElementById('pageParcels').classList.add('active');
                document.getElementById('pageTitle').textContent = 'Мои посылки';
                document.getElementById('backBtn').style.display = 'block';
            } else {
                // Если страница не найдена, показываем главную
                document.getElementById('pageMain').classList.add('active');
                document.getElementById('pageTitle').textContent = 'ZERO CARGO';
                document.getElementById('backBtn').style.display = 'none';
            }
            
            // Обновляем активный пункт нижнего меню
            document.querySelectorAll('.nav-item').forEach((item, index) => {
                item.classList.remove('active');
            });
            
            if (pageName === 'main') {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            } else if (pageName === 'parcels') {
                document.querySelectorAll('.nav-item')[1].classList.add('active');
            } else if (pageName === 'profile') {
                document.querySelectorAll('.nav-item')[2].classList.add('active');
            } else {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            }
        }

        // Кнопка "Назад"
        function goBack() {
            showPage('main');
        }

        // Переключение бокового меню
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.classList.toggle('active');
        }

        // Показать загрузку
        function showLoading() {
            const loader = document.createElement('div');
            loader.id = 'loader';
            loader.className = 'loader';
            loader.innerHTML = '<div class="spinner"></div><p>Загрузка данных...</p>';
            document.body.appendChild(loader);
        }

        // Скрыть загрузку
        function hideLoading() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.remove();
            }
        }

        // Закрытие меню при клике вне его
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('sideMenu');
            const menuBtn = document.querySelector('.menu-btn');
            
            if (menu && menuBtn && !menu.contains(event.target) && !menuBtn.contains(event.target) && menu.classList.contains('active')) {
                menu.classList.remove('active');
            }
        });

        // Экспорт функций
        window.showPage = showPage;
        window.goBack = goBack;
        window.toggleMenu = toggleMenu;
        window.copyChinaAddress = copyChinaAddress;
        window.copyField = copyField;
        window.filterParcels = filterParcels;
        window.submitTracks = submitTracks;
    </script>
