services:
  - type: web
    name: zerocargo-webapp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webapp:app --bind 0.0.0.0:$PORT
    envVars:
      - key: BOT_TOKEN
        value: 8676654212:AAFtmReTMfPUrBMkVGSqc2XTUoBhmiwMmaU
      - key: ADMIN_ID
        value: "1053328646"
      - key: WEBAPP_URL
        value: https://zerocargo-webapp.onrender.com

  - type: worker
    name: zerocargo-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        value: 8676654212:AAFtmReTMfPUrBMkVGSqc2XTUoBhmiwMmaU
      - key: ADMIN_ID
        value: "1053328646"
      - key: WEBAPP_URL
        value: https://zerocargo-webapp.onrender.com
