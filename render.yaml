services:
  - type: web
    name: zerocargo-webapp
    env: python
    region: frankfurt  # или singapore, если ближе к Китаю
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn webapp:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false  # будет запрошен при деплое
      - key: ADMIN_ID
        value: "1053328646"
      - key: WEBAPP_URL
        value: https://zerocargo-webapp.onrender.com

  - type: worker
    name: zerocargo-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python -u bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "1053328646"
      - key: WEBAPP_URL
        value: https://zerocargo-webapp.onrender.com
